name: metatrack-dev

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./dev/postgres-init.sh:/docker-entrypoint-initdb.d/10-create-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-bootstrap:
    image: postgres:18.6-bookworm
    entrypoint: ["bash", "/usr/local/bin/postgres-init.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      PGHOST: postgres
      PGPORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./dev/postgres-init.sh:/usr/local/bin/postgres-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT}:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
      MC_HOST_local: http://${SILO_ROOT_USER}:${SILO_ROOT_PASSWORD}@localhost:9000
    ports:
      - "127.0.0.1:${SILO_API_HOST_PORT}:9000"
      - "127.0.0.1:${SILO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - silo-data:/data
    healthcheck:
      test: ["CMD", "mcli", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  silo-bootstrap:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    entrypoint: ["mcli"]
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET_NAME}"]
    environment:
      MC_HOST_local: http://${SILO_ROOT_USER}:${SILO_ROOT_PASSWORD}@silo:9000
    depends_on:
      silo:
        condition: service_healthy

  sftpgo:
    image: drakkan/sftpgo:v2.7.6@sha256:1edd28d80de2a008863fbfc58c8ff7db47b1b410bae48d4e6076192337809b11
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DATA_PROVIDER__USERS_BASE_DIR: /srv/sftpgo/data
      SFTPGO_DATA_PROVIDER__TRACK_QUOTA: "2"
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USERNAME:?SFTPGO_ADMIN_USERNAME must be set}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:?SFTPGO_ADMIN_PASSWORD must be set}
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: 0.0.0.0
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
      SFTPGO_SFTPD__BINDINGS__0__ADDRESS: 0.0.0.0
      SFTPGO_SFTPD__BINDINGS__0__PORT: "2022"
      SFTPGO_COMMON__UPLOAD_MODE: "6"
      SFTPGO_COMMON__RESUME_MAX_SIZE: ${SFTPGO_RESUME_MAX_SIZE_BYTES:-53687091200}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${SFTPGO_SFTP_HOST_PORT}:2022"
      - "127.0.0.1:${SFTPGO_HTTP_HOST_PORT}:8080"
    volumes:
      - sftpgo-control:/var/lib/sftpgo
      - sftpgo-pipe:/srv/sftpgo
    depends_on:
      silo:
        condition: service_healthy

volumes:
  postgres-data:
  keycloak-data:
  silo-data:
  sftpgo-control:
  sftpgo-pipe: