quarkus:
  http:
    cors:
      enabled: true
      origins: "*"
    port: 1234
    access-log:
      enabled: true
      log-to-file: false
  virtual-threads:
    enabled: true
  hibernate-orm:
    database:
      start-offline: true
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    migrate-at-start: true
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${JDBC_STRING}
  oidc:
    application-type: service
    auth-server-url: ${KEYCLOAK_URL}
  smallrye-openapi:
    path: /openapi
    always-include: true
metatrack:
  s3:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    bucket-name: ${S3_BUCKET_NAME:metatrack}
  file:
    presign-expiry-seconds: 600
    reconciliation-interval: ${FILE_RECONCILIATION_INTERVAL:10s}
    reconciliation-batch-size: ${FILE_RECONCILIATION_BATCH_SIZE:100}
taxon-api/mp-rest/url: ${TAXON_API_URL:http://localhost:8080}
