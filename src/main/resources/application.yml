quarkus:
  http:
    cors:
      enabled: true
      origins: "*"
    port: 1234
    access-log:
      enabled: true
      log-to-file: false
  virtual-threads:
    enabled: true
  hibernate-orm:
    database:
      start-offline: true
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  datasource:
    db-kind: postgresql
    username: metatrack
    password: ${DB_PASSWORD}
    jdbc:
      url: jdbc:postgresql://localhost:5432/metatrack
  oidc:
    application-type: service
    auth-server-url: https://auth.metatrack.no/realms/metatrack
  minio:
    host: https://storage.metatrack.no
    port:
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    secure: true
    region: eu-west-1
    force-path-style: true
    bucket-name: metatrack
  smallrye-openapi:
    path: /openapi
    always-include: true
metatrack:
  webhook:
    minio-secret: ${MINIO_SECRET_KEY}
  file:
    presign-expiry-seconds: 600
taxon-api/mp-rest/url: ${TAXON_API_URL:http://localhost:8080}
