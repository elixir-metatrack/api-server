quarkus:
  mailer:
    log-invalid-recipients: false
    log-rejected-recipients: false
  http:
    cors:
      enabled: true
      origins: "*"
    port: 1234
    access-log:
      enabled: true
      exclude-pattern: ^/api/users/search(?:/.*)?$
      log-to-file: false
  virtual-threads:
    enabled: true
  hibernate-orm:
    database:
      start-offline: true
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    migrate-at-start: true
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${JDBC_STRING}
  oidc:
    application-type: service
    auth-server-url: ${KEYCLOAK_URL}
    roles:
      role-claim-path: realm_access/roles
  oidc-client:
    keycloak-admin:
      auth-server-url: ${KEYCLOAK_URL}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      credentials:
        secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      grant:
        type: client
  cache:
    caffeine:
      keycloak-usernames:
        expire-after-write: ${KEYCLOAK_USERNAME_CACHE_TTL:10M}
        maximum-size: ${KEYCLOAK_USERNAME_CACHE_MAX_SIZE:1000}
      keycloak-identities:
        expire-after-write: ${KEYCLOAK_USERNAME_CACHE_TTL:10M}
        maximum-size: ${KEYCLOAK_USERNAME_CACHE_MAX_SIZE:1000}
      keycloak-user-search:
        expire-after-write: ${KEYCLOAK_USER_SEARCH_CACHE_TTL:5M}
        maximum-size: ${KEYCLOAK_USER_SEARCH_CACHE_MAX_SIZE:1000}
  smallrye-openapi:
    path: /openapi
    always-include: true
metatrack:
  invitation:
    expiry: ${INVITATION_EXPIRY:P7D}
    resend-cooldown: ${INVITATION_RESEND_COOLDOWN:PT60S}
    sending-timeout: ${INVITATION_SENDING_TIMEOUT:PT5M}
  s3:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    bucket-name: ${S3_BUCKET_NAME:metatrack}
  file:
    presign-expiry-seconds: 600
    reconciliation-interval: ${FILE_RECONCILIATION_INTERVAL:10s}
    reconciliation-batch-size: ${FILE_RECONCILIATION_BATCH_SIZE:100}
  sftpgo:
    enabled: ${SFTPGO_ENABLED:false}
    api-url: ${SFTPGO_API_URL:http://localhost:18082}
    admin-username: ${SFTPGO_ADMIN_USERNAME:}
    admin-password: ${SFTPGO_ADMIN_PASSWORD:}
    sftp-host: ${SFTPGO_SFTP_HOST:localhost}
    sftp-port: ${SFTPGO_SFTP_PORT:2022}
    s3-endpoint: ${SFTPGO_S3_ENDPOINT:}
    s3-region: ${SFTPGO_S3_REGION:}
    s3-access-key: ${SFTPGO_S3_ACCESS_KEY:}
    s3-secret-key: ${SFTPGO_S3_SECRET_KEY:}
    s3-bucket-name: ${SFTPGO_S3_BUCKET_NAME:}
    s3-path-style-access: ${SFTPGO_S3_PATH_STYLE_ACCESS:true}
    hook-url: ${SFTPGO_HOOK_URL:http://localhost:1234/api/internal/sftpgo/events}
    hook-secret: ${SFTPGO_HOOK_SECRET:}
    resume-max-size-bytes: ${SFTPGO_RESUME_MAX_SIZE_BYTES:53687091200}
  upload-batches:
    max-files-per-batch: ${UPLOAD_BATCH_MAX_FILES:100}
    max-file-size-bytes: ${UPLOAD_BATCH_MAX_FILE_SIZE_BYTES:53687091200}
    max-transfers-per-batch: ${UPLOAD_BATCH_MAX_TRANSFERS_PER_BATCH:2}
    max-total-transfers: ${UPLOAD_BATCH_MAX_TOTAL_TRANSFERS:8}
    max-ingestion-workers: ${UPLOAD_BATCH_MAX_INGESTION_WORKERS:2}
    multipart-copy-part-size-bytes: ${UPLOAD_BATCH_MULTIPART_COPY_PART_SIZE_BYTES:16777216}
    staging-budget-bytes: ${UPLOAD_BATCH_STAGING_BUDGET_BYTES:0}
    max-manifest-bytes: ${UPLOAD_BATCH_MAX_MANIFEST_BYTES:1048576}
    upload-window: ${UPLOAD_BATCH_UPLOAD_WINDOW:P7D}
    failed-staging-retention: ${UPLOAD_BATCH_FAILED_STAGING_RETENTION:P7D}
  admin:
    stalled-upload-threshold: ${ADMIN_STALLED_UPLOAD_THRESHOLD:PT2H}
taxon-api/mp-rest/url: ${TAXON_API_URL:http://localhost:8080}
sftpgo-api/mp-rest/url: ${SFTPGO_API_URL:http://localhost:18082}
keycloak-admin-api/mp-rest/url: ${KEYCLOAK_BASE_URL}
keycloak:
  realm: ${KEYCLOAK_REALM}
  profile:
    attributes:
      country: ${KEYCLOAK_PROFILE_COUNTRY_ATTRIBUTE:Country}
      institution: ${KEYCLOAK_PROFILE_INSTITUTION_ATTRIBUTE:Institution}
      orcid: ${KEYCLOAK_PROFILE_ORCID_ATTRIBUTE:ORCID}

"%prod":
  metatrack:
    invitation:
      login-url: ${INVITATION_LOGIN_URL}
      registration-url: ${INVITATION_REGISTRATION_URL}
  quarkus:
    mailer:
      mock: false
      from: ${SMTP_FROM}
      host: ${SMTP_HOST}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      start-tls: REQUIRED
      login: REQUIRED
      tls: false
      tls-configuration-name: invitation
      timeout: 30S
    tls:
      invitation:
        trust-all: false
        hostname-verification-algorithm: HTTPS

"%dev":
  metatrack:
    invitation:
      login-url: ${INVITATION_LOGIN_URL:http://localhost:3000/login}
      registration-url: ${INVITATION_REGISTRATION_URL:http://localhost:3000/register}
  quarkus:
    mailer:
      mock: true
      from: invitations@example.invalid

"%remote-dev":
  quarkus:
    flyway:
      migrate-at-start: false
    mailer:
      mock: true
      from: invitations@example.invalid
  metatrack:
    invitation:
      login-url: ${INVITATION_LOGIN_URL:http://localhost:3000/login}
      registration-url: ${INVITATION_REGISTRATION_URL:http://localhost:3000/register}

"%test":
  metatrack:
    invitation:
      login-url: https://spa.example.test/login
      registration-url: https://spa.example.test/register
  quarkus:
    security:
      events:
        enabled: true
    mailer:
      mock: true
      from: invitations@example.invalid
