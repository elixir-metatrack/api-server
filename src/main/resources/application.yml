quarkus:
  http:
    cors:
      enabled: true
      origins: "*"
    port: 1234
    access-log:
      enabled: true
      log-to-file: false
  virtual-threads:
    enabled: true
  hibernate-orm:
    database:
      start-offline: true
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    migrate-at-start: true
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${JDBC_STRING}
  oidc:
    application-type: service
    auth-server-url: ${KEYCLOAK_URL}
    roles:
      role-claim-path: realm_access/roles
  oidc-client:
    keycloak-admin:
      auth-server-url: ${KEYCLOAK_URL}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      credentials:
        secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      grant:
        type: client
  cache:
    caffeine:
      keycloak-usernames:
        expire-after-write: ${KEYCLOAK_USERNAME_CACHE_TTL:10M}
        maximum-size: ${KEYCLOAK_USERNAME_CACHE_MAX_SIZE:1000}
  smallrye-openapi:
    path: /openapi
    always-include: true
metatrack:
  s3:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    bucket-name: ${S3_BUCKET_NAME:metatrack}
  file:
    presign-expiry-seconds: 600
    reconciliation-interval: ${FILE_RECONCILIATION_INTERVAL:10s}
    reconciliation-batch-size: ${FILE_RECONCILIATION_BATCH_SIZE:100}
taxon-api/mp-rest/url: ${TAXON_API_URL:http://localhost:8080}
keycloak-admin-api/mp-rest/url: ${KEYCLOAK_BASE_URL}
keycloak:
  realm: ${KEYCLOAK_REALM}
