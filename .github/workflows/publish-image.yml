name: Build and publish container image to GHCR

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write # Required for SLSA attestation

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: 'maven'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (Quarkus)
        id: build
        run: |
          # Ensure lowercase owner and repo names for GHCR
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME_LC="ghcr.io/${OWNER_LC}/${REPO_NAME}"

          # Use all tags generated by metadata-action
          # Jib expects a primary tag and optional additional tags (comma-separated)
          # We need to strip the base image name from the tags output by metadata-action
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr '[:upper:]' '[:lower:]' | sed "s|${IMAGE_NAME_LC}:||g" | tr '\n' ',' | sed 's/,$//')
          PRIMARY_TAG=$(echo "$TAGS" | cut -d',' -f1)
          ADDITIONAL_TAGS=$(echo "$TAGS" | cut -d',' -f2-)
          
          ./mvnw -B package \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.builder=jib \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group=${OWNER_LC} \
            -Dquarkus.container-image.name=${REPO_NAME} \
            -Dquarkus.container-image.tag=${PRIMARY_TAG} \
            -Djib.to.tags=${ADDITIONAL_TAGS} \
            -Dquarkus.jib.platforms=linux/amd64,linux/arm64 \
            -Dquarkus.jib.image-digest-file=target/jib-image.digest
          
          # Pass outputs to the next steps (ensure digest has sha256 prefix)
          DIGEST=$(cat target/jib-image.digest | tr -d '[:space:]')
          echo "digest=sha256:${DIGEST}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME_LC}" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.build.outputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true