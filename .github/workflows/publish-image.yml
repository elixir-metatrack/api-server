name: Build and publish container image to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      image-tag:
        description: Exact image tag to publish for a release
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
            type=ref,event=branch,enable=${{ inputs.image-tag == '' }}
            type=sha,enable=${{ inputs.image-tag == '' }}
            type=raw,value=latest,enable=${{ inputs.image-tag == '' && github.ref_name == github.event.repository.default_branch }}

      - name: Build and push (Quarkus)
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          PRIMARY_TAG="${{ steps.meta.outputs.version }}"
          ADDITIONAL_TAGS=""

          while IFS= read -r image_tag; do
            tag="${image_tag##*:}"
            if [ -n "$tag" ] && [ "$tag" != "$PRIMARY_TAG" ]; then
              ADDITIONAL_TAGS="${ADDITIONAL_TAGS:+${ADDITIONAL_TAGS},}${tag}"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

          ./mvnw -B -DskipTests package \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.builder=jib \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group="${OWNER_LC}" \
            -Dquarkus.container-image.name="${REPO_NAME}" \
            -Dquarkus.container-image.tag="${PRIMARY_TAG}" \
            -Djib.to.tags="${ADDITIONAL_TAGS}"