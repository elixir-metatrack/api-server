polygon fill="#475569" points="667.15,270.7647,658.15,266.7647,662.15,270.7647,658.15,274.7647,667.15,270.7647" style="stroke:#475569;stroke-width:1.4;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118" x="528.75" y="264.333">sample accessions</text></g><!--link ena to receipt--><g id="link_ena_receipt"><path d="M1179.89,270.7647 C1193.06,270.7647 1200.23,270.7647 1213.4,270.7647 " fill="none" id="ena-to-receipt" style="stroke:#475569;stroke-width:1.4;"/><polygon fill="#475569" points="1219.4,270.7647,1210.4,266.7647,1214.4,270.7647,1210.4,274.7647,1219.4,270.7647" style="stroke:#475569;stroke-width:1.4;"/></g><!--link bs to dbbs--><g id="link_bs_dbbs"><path d="M396.5,311.8747 C396.5,341.9747 396.5,376.0147 396.5,400.2147 " fill="none" id="bs-to-dbbs" style="stroke:#475569;stroke-width:1.4;"/><polygon fill="#475569" points="396.5,406.2147,400.5,397.2147,396.5,401.2147,392.5,397.2147,396.5,406.2147" style="stroke:#475569;stroke-width:1.4;"/></g><!--link ena to dbena--><g id="link_ena_dbena"><path d="M923.5,334.6647 C923.5,359.9947 923.5,381.5147 923.5,399.9647 " fill="none" id="ena-to-dbena" style="stroke:#475569;stroke-width:1.4;"/><polygon fill="#475569" points="923.5,405.9647,927.5,396.9647,923.5,400.9647,919.5,396.9647,923.5,405.9647" style="stroke:#475569;stroke-width:1.4;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="68" x="924.5" y="379.923">Webin XML</text></g><!--link receipt to mt--><g id="link_receipt_mt"><path d="M1282.62,245.2447 C1265.88,220.1647 1236.18,182.4947 1199.5,165.1847 C1002.36,72.1147 436.53,131.4247 220.5,102.1847 C213.92,101.2847 213.076,101.2452 206.276,100.0952 " fill="none" id="receipt-to-mt" style="stroke:#475569;stroke-width:1.4;stroke-dasharray:7.0,7.0;"/><polygon fill="#475569" points="200.36,99.0947,208.567,104.5394,205.29,99.9284,209.901,96.6514,200.36,99.0947" style="stroke:#475569;stroke-width:1.4;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="58" x="1215.12" y="138.753">not built:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138" x="1175.12" y="154.0636">write accessions back</text></g><rect fill="none" height="75.9531" id="_legend" rx="5" ry="5" style="stroke:#000000;stroke-width:1.0;" width="838" x="272.75" y="478.6652"/><text fill="#000000" filter="url(#b11ex5emk6d9me0)" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90" x="281.75" y="497.2004">tested offline</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="634" x="383.75" y="497.2004">MARS 8cc6fca in Docker: the ENA adapter builds study/experiment/run XML from our export</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="828" x="277.75" y="513.6887">and stops before the Webin submission. Result for the demo project: 1 study, 2 experiments, 2 runs, no manual changes.</text><text fill="#000000" filter="url(#b11ex5emk6d9me1)" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75" x="281.75" y="530.177">not run yet</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="650" x="368.75" y="530.177">The BioSamples adapter submits directly, so it was not run. A submission to the ENA test server</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="602" x="277.75" y="546.6652">needs a Webin test account from the team. Checklist validation (ENA) is a separate topic.</text><!--SRC=[VLLHJo9947wVNr5nN_HEG5JSrHWIN6331TGmR6xDUJ4rFGNqCdHptOsUk_5rVy3znFibLzqzmgYRamTdkgg_-ghggngxa6g51fUGeLZCZ5wh_ACkj85t_V2Ns8r7JbDS5wwlbRl49K6AogPavFJdFgdyHj0ygXZj77Fz8DKCfbXOgbX2NA6D8WFDWuf1wPmihU2uUcXGBS9XgtBOCKO_bDIFtxTQ9wUlZPEv50j5raApVbo58-5GpGg2xmd0XJOvcHBezBXpTF61Jtr2vTb1l_d-i9CyLRD6XndQ_mEuU5FUPh_LFtq1uwGhQ5E