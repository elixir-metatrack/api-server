<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="574px" preserveAspectRatio="none" style="width:1397px;height:574px;background:#FFFFFF;" version="1.1" viewBox="0 0 1397 574" width="1397px" zoomAndPan="magnify"><defs><filter height="1" id="b11ex5emk6d9me0" width="1" x="0" y="0"><feFlood flood-color="#E5F3EF" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="b11ex5emk6d9me1" width="1" x="0" y="0"><feFlood flood-color="#FFF3D6" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g><text fill="#000000" font-family="sans-serif" font-size="20" font-weight="bold" lengthAdjust="spacing" textLength="342" x="520.75" y="29.3359">From Metatrack to ENA via MARS</text><!--cluster mars--><g id="cluster_mars"><rect fill="#FAFAFA" height="177.17" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.0;" width="1122" x="269.5" y="173.1847"/><text fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94" x="783.5" y="187.753">MARS (ELIXIR)</text></g><!--entity bs--><g id="elem_bs"><rect fill="#FFF3D6" height="81.2422" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:0.5;" width="223" x="285" y="230.1447"/><text fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="133" x="295" y="252.713">BioSamples adapter</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164" x="295" y="268.0236">registers Source + Sample</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203" x="295" y="283.3341">skips samples that already carry</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109" x="295" y="298.6447">the characteristic</text><text fill="#0F172A" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="62" x="408" y="298.6447">accession</text></g><!--entity ena--><g id="elem_ena"><rect fill="#E5F3EF" height="127.1738" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:0.5;" width="512" x="667.5" y="207.1847"/><text fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85" x="677.5" y="229.753">ENA adapter</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278" x="677.5" y="245.0636">starts at each Raw Data File and walks back:</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388" x="677.5" y="260.3741">file &#8594; sequencing &#8594; Library &#8594; library construction &#8594; Sample</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="677.5" y="275.6847">&#160;</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133" x="677.5" y="290.9952">one ISA assay &#8594; ENA</text><text fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38" x="814.5" y="290.9952">study</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87" x="856.5" y="290.9952">(STUDY_TYPE)</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117" x="677.5" y="306.3058">one Library &#8594; ENA</text><text fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78" x="798.5" y="306.3058">experiment</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289" x="880.5" y="306.3058">(LIBRARY_*, PLATFORM, INSTRUMENT_MODEL)</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149" x="677.5" y="321.6163">files of a Library &#8594; ENA</text><text fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24" x="830.5" y="321.6163">run</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="858.5" y="321.6163">(file names, MD5)</text></g><!--entity receipt--><g id="elem_receipt"><rect fill="#FFFFFF" height="50.6211" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:0.5;" width="156" x="1219.5" y="245.4547"/><text fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="50" x="1229.5" y="268.023">Receipt</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136" x="1229.5" y="283.3336">accessions per object</text></g><!--entity mt--><g id="elem_mt"><rect fill="#E5F3EF" height="50.6211" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:0.5;" width="193" x="7" y="51.5547"/><text fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67" x="17" y="74.123">Metatrack</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="17" y="89.4336">project or selected samples</text></g><!--entity isa--><g id="elem_isa"><rect fill="#E5F3EF" height="50.6211" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:0.5;" width="313" x="240" y="51.5547"/><text fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62" x="250" y="74.123">ISA-JSON</text><text fill="#0F172A" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293" x="250" y="89.4336">GET/POST /api/projects/{id}/exports/isa-json</text></g><!--entity dbbs--><g id="elem_dbbs"><path d="M351,416.3547 C351,406.3547 396.5,406.3547 396.5,406.3547 C396.5,406.3547 442,406.3547 442,416.